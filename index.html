<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Viewer</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #dfe3ea; --accent: #3b5bdb; --accent-soft: #e8edff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --panel: #1c212c; --text: #e8ebf2; --muted: #98a2b3;
            --border: #2c3342; --accent: #7c93ff; --accent-soft: #252d4a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
           padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  .group { display: flex; gap: 6px; }
  button, label.btn { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px;
           border: 1px solid var(--border); background: var(--panel); color: var(--text);
           cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .spacer { flex: 1; }
  main { flex: 1; min-height: 0; display: grid; gap: 10px; padding: 10px; }
  main.split { grid-template-columns: 1fr 1fr; }
  main.single { grid-template-columns: 1fr; }
  .pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .pane.hidden { display: none; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
               border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .pane-head .name { color: var(--text); font-weight: 600; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pane-head a { color: var(--accent); text-decoration: none; font-size: 13px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  input[type=file] { display: none; }
  @media (max-width: 800px) { main.split { grid-template-columns: 1fr; grid-auto-rows: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>PDF Viewer</h1>
  <div class="group" id="modes">
    <button data-mode="split" class="active">Side by side</button>
    <button data-mode="1">PDF 1</button>
    <button data-mode="2">PDF 2</button>
  </div>
  <div class="spacer"></div>
  <label class="btn">Open PDF 1…<input type="file" accept="application/pdf" data-target="1"></label>
  <label class="btn">Open PDF 2…<input type="file" accept="application/pdf" data-target="2"></label>
</header>

<main id="main" class="split">
  <section class="pane" id="pane1">
    <div class="pane-head"><span class="name" id="name1"></span><a id="open1" target="_blank" rel="noopener">Open in new tab</a></div>
    <iframe id="frame1" title="PDF 1"></iframe>
  </section>
  <section class="pane" id="pane2">
    <div class="pane-head"><span class="name" id="name2"></span><a id="open2" target="_blank" rel="noopener">Open in new tab</a></div>
    <iframe id="frame2" title="PDF 2"></iframe>
  </section>
</main>

<script>
  // ====== EDIT THESE TWO LINES: exact file names of your PDFs (same folder as this page) ======
  const PDF_1 = "file1.pdf";
  const PDF_2 = "file2.pdf";
  // ============================================================================================

  const files = { 1: PDF_1, 2: PDF_2 };

  function load(n, url, label) {
    document.getElementById("frame" + n).src = url;
    document.getElementById("name" + n).textContent = label;
    document.getElementById("open" + n).href = url;
  }

  load(1, PDF_1, PDF_1);
  load(2, PDF_2, PDF_2);

  // Fallback / override: pick a PDF from the computer
  document.querySelectorAll("input[type=file]").forEach(input => {
    input.addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      load(input.dataset.target, URL.createObjectURL(f), f.name);
    });
  });

  // View modes
  const main = document.getElementById("main");
  document.getElementById("modes").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("active", x === b));
    const m = b.dataset.mode;
    main.className = m === "split" ? "split" : "single";
    document.getElementById("pane1").classList.toggle("hidden", m === "2");
    document.getElementById("pane2").classList.toggle("hidden", m === "1");
  });
</script>
</body>
</html>
